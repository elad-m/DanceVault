services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dancevault-dynamodb
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    volumes:
      - dancevault-dynamodb-data:/home/dynamodblocal/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dancevault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dancevault
      MINIO_ROOT_PASSWORD: dancevault-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dancevault-minio-data:/data
volumes:
  dancevault-minio-data:
  dancevault-dynamodb-data:
